# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"

  # yt-dlp version pin in scripts/requirements-sidecars.txt (consumed by
  # scripts/fetch_sidecars.py to build the release download URLs).
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "monthly"
