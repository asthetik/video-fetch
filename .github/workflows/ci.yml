name: CI

on:
  push:
    # Run on every branch push. Dependabot branches are skipped here to avoid
    # duplicate runs, since their pull_request events still trigger CI below.
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches: [main, dev]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: src-tauri
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Cache sidecar binaries
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/requirements-sidecars.txt', 'scripts/fetch_sidecars.py', 'scripts/sidecar_pins.json') }}
      - name: Fetch sidecar binaries
        run: python scripts/fetch_sidecars.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: src-tauri
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Cache sidecar binaries
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/requirements-sidecars.txt', 'scripts/fetch_sidecars.py', 'scripts/sidecar_pins.json') }}
      - name: Fetch sidecar binaries
        run: python scripts/fetch_sidecars.py
      - name: Clippy with the test-utils feature
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features test-utils --all-targets -- -D warnings
      - name: Zero-test guard
        shell: bash
        run: |
          # Expected listing: 3 support self-checks + 7 regression tests = 10;
          # >= 6 is a floor against a silent zero after a rename.
          n=$(cargo test --manifest-path src-tauri/Cargo.toml --features test-utils --test regression -- --list | grep -c ': test$')
          echo "regression tests listed: $n"
          [ "$n" -ge 6 ]
      - name: Run the regression suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --features test-utils --test regression

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Unit test release helpers
        working-directory: scripts
        run: python -m unittest discover -p "test_*.py" -v
