name: CI

on:
  # Feature branches are covered by pull_request events: with push scoped to
  # the integration branches, a branch with an open PR is not tested twice.
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Stated once rather than per job. The repository default is already read, so
# this changes nothing today; it pins the intent, so a job added later cannot
# silently inherit something wider. Every job here only reads the repository.
# Several of them run `npm ci` on a pull request's lockfile, which executes
# whatever postinstall scripts it names.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test

  lint:
    runs-on: ubuntu-24.04
    # Two clippy passes now, one per profile. The release pass compiles its
    # dependency graph cold: it shares `shared-key: src-tauri` with `unit` and
    # `integration`, whose winning entry holds no release artifacts.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: src-tauri
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Cache sidecar binaries
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/requirements-sidecars.txt', 'scripts/fetch_sidecars.py', 'scripts/sidecar_pins.json') }}
      - name: Fetch sidecar binaries
        # Required at compile time: tauri-build copies bundle.externalBin
        # entries during build.rs and fails when any is missing.
        run: python scripts/fetch_sidecars.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Clippy in the release profile
        # A dev-profile compile cannot see `#[cfg(not(debug_assertions))]` code
        # at all, so nothing has ever linted it. The smoke job compiles those
        # paths on a pull request, but a warning there fails nothing; this is
        # what makes one fail.
        #
        # Clippy expands `generate_context!`, so this does run Tauri's codegen
        # and is not skipped by stopping at metadata. It needs no frontend
        # build all the same: without the CLI's `tauri/custom-protocol` feature
        # codegen takes the `dev = true` branch, and with `devUrl` set in
        # tauri.conf.json it short-circuits to empty assets without reading
        # `frontendDist`. Adding that feature to this invocation, or removing
        # `devUrl`, would make `../dist` required in this job.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --release -- -D warnings

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: src-tauri
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Cache sidecar binaries
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/requirements-sidecars.txt', 'scripts/fetch_sidecars.py', 'scripts/sidecar_pins.json') }}
      - name: Fetch sidecar binaries
        # Required at compile time: tauri-build copies bundle.externalBin
        # entries during build.rs and fails when any is missing.
        run: python scripts/fetch_sidecars.py
      - name: Zero-test guard
        shell: bash
        run: |
          # Floor against a silent zero after a rename; platform-gated tests
          # make the per-OS count differ slightly (measured 2026-10-07:
          # 251 macOS, 250 Linux, 246 Windows).
          n=$(cargo test --manifest-path src-tauri/Cargo.toml -- --list | grep -c ': test$')
          echo "unit tests listed: $n"
          [ "$n" -ge 150 ]
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: src-tauri
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Cache sidecar binaries
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/requirements-sidecars.txt', 'scripts/fetch_sidecars.py', 'scripts/sidecar_pins.json') }}
      - name: Fetch sidecar binaries
        run: python scripts/fetch_sidecars.py
      - name: Clippy with the test-utils feature
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features test-utils --all-targets -- -D warnings
      - name: Zero-test guard
        shell: bash
        run: |
          # Expected listing: 3 support self-checks + 7 regression tests = 10;
          # >= 6 is a floor against a silent zero after a rename.
          n=$(cargo test --manifest-path src-tauri/Cargo.toml --features test-utils --test regression -- --list | grep -c ': test$')
          echo "regression tests listed: $n"
          [ "$n" -ge 6 ]
      - name: Run the regression suite
        # Serial: ten parallel PyInstaller cold starts on a 4-vCPU runner make
        # every timing assumption in the suite meaningless (and cost more
        # wall-clock than running the tests one after another).
        run: cargo test --manifest-path src-tauri/Cargo.toml --features test-utils --test regression -- --test-threads=1

  release-smoke:
    # The release profile is read by `npx tauri build` and by nothing else, and
    # that command only runs on a tag. Every other job here compiles in the dev
    # or test profile, so a `[profile.release]` that cannot build would not be
    # discovered until a release was already being cut. This compiles what the
    # release compiles, on all five targets the release runs on, and publishes
    # nothing.
    #
    # It goes through the CLI rather than a bare `cargo build --release`: the
    # CLI adds `--features tauri/custom-protocol`, which selects a different
    # embedded-asset code path, and spelling that flag out here would drift
    # silently if the CLI ever changed it.
    #
    # `--no-bundle` is what keeps this affordable: no installers are built. The
    # frontend build cannot be skipped the way the dev-profile jobs skip it:
    # the CLI is what turns on `tauri/custom-protocol`, which flips codegen's
    # `dev` to false and makes the `frontendDist` directory required.
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in step with release.yml's: a target the release builds
        # and this does not is one whose release profile goes unverified, and
        # neither workflow would say so.
        os: [ubuntu-24.04, macos-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Its own bucket: the other jobs cache dev-profile artifacts, and one
          # shared entry would have them evicting each other.
          shared-key: src-tauri-release
          # Save only from the integration branches. The store is capped at
          # 10 GiB for the whole repository and a release entry is measured at
          # 450-550 MB per platform, so a copy written per pull request is both
          # large and unreadable to any other run. PRs still restore, including
          # from `main`, so they only lose the first run's warmth.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Cache sidecar binaries
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/requirements-sidecars.txt', 'scripts/fetch_sidecars.py', 'scripts/sidecar_pins.json') }}
      - name: Fetch sidecar binaries
        # Required at compile time: tauri-build copies bundle.externalBin
        # entries during build.rs and fails when any is missing.
        run: python scripts/fetch_sidecars.py
      - run: npm ci
      - name: Build the release profile
        run: npx tauri build --no-bundle
      - name: Assert the build produced a binary
        shell: bash
        # The exit code already says the compile succeeded. This guards the
        # other half: that a release build is still what happened. Both
        # `tauri build` and its cargo invocation could start assuming an
        # artifact that is already there, and the job would go quietly green
        # having compiled nothing.
        run: |
          bin=src-tauri/target/release/video-fetch
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          [ -f "$bin" ] || { echo "no release binary at $bin"; exit 1; }
          # A stub detector, not a size assertion: every platform's real bundle
          # is well over this, and an empty or truncated file is not.
          size=$(wc -c < "$bin")
          echo "release binary: $bin, $size bytes"
          [ "$size" -ge 10000000 ] || { echo "$bin looks like a stub"; exit 1; }

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Unit test release helpers
        working-directory: scripts
        run: python -m unittest discover -p "test_*.py" -v
