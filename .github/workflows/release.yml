name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Verify tag matches package versions
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tag format: $TAG" >&2
            exit 1
          fi
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          CARGO=$(node -p "require('fs').readFileSync('src-tauri/Cargo.toml','utf8').match(/^\s*version\s*=\s*\"([^\"]+)\"/m)[1]")
          echo "tag=$TAG expected=$EXPECTED pkg=$PKG tauri=$TAURI cargo=$CARGO"
          if [[ "$PKG" != "$EXPECTED" || "$TAURI" != "$EXPECTED" || "$CARGO" != "$EXPECTED" ]]; then
            echo "Version mismatch: tag $TAG must match package.json, tauri.conf.json, and Cargo.toml ($EXPECTED)" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache sidecar binaries
        uses: actions/cache@v5
        with:
          path: src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch_sidecars.py') }}

      - name: Fetch sidecar binaries
        run: python scripts/fetch_sidecars.py

      - run: npm ci

      - name: Build Tauri app
        env:
          CI: true
        run: npx tauri build

      - name: Normalize Windows MSI filename
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            base=$(basename "$f")
            # VideoFetch_0.1.0_x64_en-US.msi -> VideoFetch_0.1.0_x64-setup.msi
            if [[ "$base" =~ ^(.+_[^_]+)_[A-Za-z]{2}-[A-Za-z]{2}\.msi$ ]]; then
              dest="$(dirname "$f")/${BASH_REMATCH[1]}-setup.msi"
              mv "$f" "$dest"
              echo "Renamed $base -> $(basename "$dest")"
            fi
          done

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*-setup.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
