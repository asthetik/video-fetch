name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            release_os: macOS
            release_arch: arm64
          - platform: windows-latest
            release_os: Windows
            release_arch: x64
          - platform: windows-11-arm
            release_os: Windows
            release_arch: arm64
          - platform: ubuntu-22.04
            release_os: Linux
            release_arch: x86_64
          - platform: ubuntu-22.04-arm
            release_os: Linux
            release_arch: arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify tag matches package versions
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tag format: $TAG" >&2
            exit 1
          fi
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          CARGO=$(node -p "require('fs').readFileSync('src-tauri/Cargo.toml','utf8').match(/^\s*version\s*=\s*\"([^\"]+)\"/m)[1]")
          echo "tag=$TAG expected=$EXPECTED pkg=$PKG tauri=$TAURI cargo=$CARGO"
          if [[ "$PKG" != "$EXPECTED" || "$TAURI" != "$EXPECTED" || "$CARGO" != "$EXPECTED" ]]; then
            echo "Version mismatch: tag $TAG must match package.json, tauri.conf.json, and Cargo.toml ($EXPECTED)" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache sidecar binaries
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch_sidecars.py') }}

      - name: Fetch sidecar binaries
        run: python scripts/fetch_sidecars.py

      - run: npm ci

      - name: Build Tauri app
        env:
          CI: true
        run: npx tauri build

      - name: Rename installers for Release
        shell: bash
        env:
          RELEASE_OS: ${{ matrix.release_os }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION=$(node -p "require('./package.json').version")
          OUT=release-assets
          mkdir -p "$OUT"

          rename_one() {
            local src="$1"
            local ext="$2"
            local dest
            dest=$(python scripts/release_asset_name.py \
              --os "$RELEASE_OS" --arch "$RELEASE_ARCH" \
              --version "$VERSION" --ext "$ext")
            cp "$src" "$OUT/$dest"
            echo "Prepared $dest from $(basename "$src")"
          }

          found=0
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            [[ -f "$f" ]] || continue
            rename_one "$f" dmg
            found=1
          done
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            [[ -f "$f" ]] || continue
            rename_one "$f" msi
            found=1
          done
          # Prefer *-setup.exe; fall back to a single *.exe if needed.
          exe_done=0
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe; do
            [[ -f "$f" ]] || continue
            rename_one "$f" exe
            found=1
            exe_done=1
            break
          done
          if [[ "$exe_done" -eq 0 ]]; then
            for f in src-tauri/target/release/bundle/nsis/*.exe; do
              [[ -f "$f" ]] || continue
              rename_one "$f" exe
              found=1
              break
            done
          fi
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [[ -f "$f" ]] || continue
            rename_one "$f" AppImage
            found=1
          done
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            [[ -f "$f" ]] || continue
            rename_one "$f" deb
            found=1
          done

          if [[ "$found" -eq 0 ]]; then
            echo "No installers found to rename" >&2
            find src-tauri/target/release/bundle -type f || true
            exit 1
          fi
          ls -la "$OUT"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    # Publish whatever succeeded when at least one matrix cell uploaded artifacts.
    if: ${{ always() && !cancelled() && contains(fromJSON('["success", "failure"]'), needs.build.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: bundles-*
          merge-multiple: true

      - name: List assets
        run: |
          set -euo pipefail
          ls -la artifacts
          test -n "$(find artifacts -type f | head -1)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
