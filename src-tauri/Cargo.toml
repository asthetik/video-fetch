[package]
name = "video-fetch"
version = "0.4.0"
description = "影取 — lightweight video downloader"
authors = ["asthetik"]
license = "Apache-2.0"
repository = "https://github.com/asthetik/video-fetch"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "video_fetch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
url = "2.5.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.2", features = ["process", "sync", "rt", "macros", "time", "io-util"] }
async-trait = "0.1.92"
tauri-plugin-dialog = "2.8.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
which = "8.0.6"
tauri-plugin-shell = "2.4.0"
tauri-plugin-single-instance = "2.5.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
md-5 = "0.11.0"
percent-encoding = "2.3.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "time", "local-time"] }
tracing-appender = "0.2.5"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
# kill(2) for process-group termination of the yt-dlp tree (PyInstaller spawns
# a second stage; killing the direct child alone leaves it downloading).
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
