[package]
name = "video-fetch"
version = "0.3.0"
description = "影取 — lightweight video downloader"
authors = ["asthetik"]
license = "Apache-2.0"
repository = "https://github.com/asthetik/video-fetch"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "video_fetch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1.53", features = ["process", "sync", "rt", "macros", "time", "io-util"] }
async-trait = "0.1"
tauri-plugin-dialog = "2.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
which = "8.0"
tauri-plugin-shell = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
md-5 = "0.11"
percent-encoding = "2.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "time", "local-time"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3.27"
